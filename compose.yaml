# SparkyRivals production: bootstrap once, then docker compose up -d.
# Never publish host ports. NPM reaches only the frontend over prod-frontend.
name: sparkyrivals
services:
  sparkyrivals-db:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SPARKY_FITNESS_DB_NAME:-sparkyfitness_db}
      POSTGRES_USER: ${SPARKY_FITNESS_DB_USER:-sparky}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - type: bind
        source: ./dockerdata/postgres
        target: /var/lib/postgresql
        bind: { create_host_path: false }
      - type: bind
        source: ./dockerdata/secrets/db_password
        target: /run/secrets/db_password
        read_only: true
        bind: { create_host_path: false }
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [sparkyrivals-internal]

  sparkyrivals-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    pull_policy: build
    restart: unless-stopped
    init: true
    # Preserves optional upstream email/OIDC/provider/admin/rate-limit settings.
    # Build credentials must never enter this runtime file.
    env_file: ./dockerdata/config/runtime.env
    environment:
      NODE_ENV: production
      SPARKY_FITNESS_REMOTE_PUSH_ENABLED: ${SPARKY_FITNESS_REMOTE_PUSH_ENABLED:-false}
      EXPO_ACCESS_TOKEN_FILE: ${EXPO_ACCESS_TOKEN_FILE:-}
      SPARKY_FITNESS_DB_HOST: sparkyrivals-db
      SPARKY_FITNESS_DB_PORT: 5432
      SPARKY_FITNESS_SERVER_PORT: 3010
      SPARKY_FITNESS_DB_PASSWORD_FILE: /run/secrets/db_password
      SPARKY_FITNESS_APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      SPARKY_FITNESS_API_ENCRYPTION_KEY_FILE: /run/secrets/api_encryption_key
      BETTER_AUTH_SECRET_FILE: /run/secrets/auth_secret
      SPARKY_FITNESS_CUSTOM_UPLOADS_DIRECTORY: /app/SparkyFitnessServer/uploads
      SPARKY_FITNESS_CUSTOM_BACKUP_DIRECTORY: /app/SparkyFitnessServer/backup
    volumes:
      - type: bind
        source: ./dockerdata/uploads
        target: /app/SparkyFitnessServer/uploads
        bind: { create_host_path: false }
      - type: bind
        source: ./dockerdata/backups
        target: /app/SparkyFitnessServer/backup
        bind: { create_host_path: false }
      - type: bind
        source: ./dockerdata/secrets
        target: /run/secrets
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      sparkyrivals-db: { condition: service_healthy }
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:3010/api/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks: [sparkyrivals-internal]

  sparkyrivals-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    pull_policy: build
    restart: unless-stopped
    init: true
    environment:
      SPARKY_FITNESS_FRONTEND_URL: ${SPARKY_FITNESS_FRONTEND_URL:?Run scripts/bootstrap-production.py first}
      SPARKY_FITNESS_SERVER_HOST: sparkyrivals-server
      SPARKY_FITNESS_SERVER_PORT: 3010
      NGINX_LISTEN_PORT: 80
      NGINX_RATE_LIMIT: ${NGINX_RATE_LIMIT:-5r/s}
      NGINX_RESOLVER: 127.0.0.11
      NGINX_ACCESS_LOG: /dev/stdout
      NGINX_ERROR_LOG: /dev/stderr
      NGINX_DUMP_CONFIG: "false"
    # Adapts proxy scheme to the configured external origin, retaining all
    # upstream nginx routes and entrypoint behavior. No client-supplied trust.
    command: [/bin/sh, /sparkyrivals/frontend-entrypoint.sh]
    volumes:
      - type: bind
        source: ./docker/sparkyrivals/frontend-entrypoint.sh
        target: /sparkyrivals/frontend-entrypoint.sh
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      sparkyrivals-server: { condition: service_healthy }
    networks: [sparkyrivals-internal, prod-frontend]

networks:
  sparkyrivals-internal:
    driver: bridge
  prod-frontend:
    external: true
    name: prod-frontend
