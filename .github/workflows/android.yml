name: Build Android APK

# Runs on publish rather than on the v* tag push. release-please.yml creates the
# tag together with the draft, before anyone has approved the release, and a tag
# pushed with GITHUB_TOKEN would not trigger this workflow at all. On a release
# event github.ref is still refs/tags/<tag>, so the steps below are unchanged.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'CodeWithCJ/SparkyFitness'
    runs-on: ubuntu-latest
    env:
      MYAPP_RELEASE_STORE_FILE: ${{ github.workspace }}/SparkyFitnessMobile/android/app/sparky-fitness-release-key.keystore
      MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          pnpm install --frozen-lockfile
          cd SparkyFitnessMobile
          APP_VARIANT=production npx expo prebuild --platform android

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-Wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x SparkyFitnessMobile/android/gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > SparkyFitnessMobile/android/local.properties

      - name: Decode and setup keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > SparkyFitnessMobile/android/app/sparky-fitness-release-key.keystore
          echo "Keystore created at: $(pwd)/SparkyFitnessMobile/android/app/sparky-fitness-release-key.keystore"
          ls -la SparkyFitnessMobile/android/app/sparky-fitness-release-key.keystore

      - name: Generate codegen and verify the debug build
        run: |
          cd SparkyFitnessMobile/android
          ./gradlew :app:generateCodegenArtifactsFromSchema :app:assembleDebug --stacktrace

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        run: |
          cd SparkyFitnessMobile/android
          ./gradlew :app:assembleRelease \
            --stacktrace

      - name: Get APK path
        if: github.event_name != 'pull_request'
        id: apk
        run: |
          APK_PATH=$(find SparkyFitnessMobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"

      - name: Build Release AAB
        if: github.event_name != 'pull_request'
        run: |
          cd SparkyFitnessMobile/android
          ./gradlew :app:bundleRelease \
            --stacktrace

      - name: Get AAB path
        if: github.event_name != 'pull_request'
        id: aab
        run: |
          AAB_PATH=$(find SparkyFitnessMobile/android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          echo "path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$AAB_PATH")" >> "$GITHUB_OUTPUT"

      - name: Get version from package.json
        if: github.event_name != 'pull_request'
        id: version
        run: |
          VERSION=$(node -p "require('./SparkyFitnessMobile/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.aab.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
